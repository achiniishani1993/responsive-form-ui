<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive-form-UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/styles/normalize.css" />
    <link rel="stylesheet" href="/styles/index.css" />
    <link rel="stylesheet" href="/styles/shared.css" />
  </head>
  <body>
    <main class="page">
      <section class="video-container">
        <div class="video">
          <video width="1000" height="600" controls>
            <source src="/Video/Caffe Norra.mp4" type="video/mp4" />
          </video>
        </div>

        <a href="#popupForm" class="table-btn">Book a Table</a>
        <div id="popupForm" class="popup">
          <div class="popup-content">
            <a href="#" class="close-btn">
              <img src="/Images/clsoe.svg" alt="close" />
            </a>
            <h2>Reserve a Table</h2>
            <form action="message.html" method="get">
              <div>
                <label for="booking_name">Name</label>
                <input
                  type="text"
                  id="booking_name"
                  name="booking_name"
                  placeholder="Name"
                  autofocus
                  required
                />
              </div>
              <div>
                <label for="persons">Party size</label>
                <select name="persons" id="persons">
                  <option value="1-2 guests">1-2 guests</option>
                  <option value="2-4 guests">2-4 guests</option>
                  <option value="4-6 guests">4-6 guests</option>
                  <option value="8-more guests">8-more guests</option>
                </select>
              </div>
              <div>
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required />
              </div>
              <div>
                <label for="time">Time</label>
                <select name="time" id="time">
                  <option value="5:00 PM">5:00 PM</option>
                  <option value="5:15 PM">5:15 PM</option>
                  <option value="5:30 PM">5:30 PM</option>
                  <option value="5:45 PM">5:45 PM</option>
                  <option value="6:00 PM">6:00 PM</option>
                  <option value="6:15 PM">6:15 PM</option>
                  <option value="6:30 PM">6:30 PM</option>
                  <option value="6:45 PM">6:45 PM</option>
                  <option value="7:00 PM">7:00 PM</option>
                  <option value="7:15 PM">7:15 PM</option>
                  <option value="7:30 PM">7:30 PM</option>
                  <option value="7:45 PM">7:45 PM</option>
                  <option value="8:00 PM">8:00 PM</option>
                  <option value="8:15 PM">8:15 PM</option>
                  <option value="8:30 PM">8:30 PM</option>
                  <option value="8:45 PM">8:45 PM</option>
                  <option value="9:00 PM">9:00 PM</option>
                </select>
              </div>
              <div>
                <label for="phone">Phone number</label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  placeholder="076-45-678"
                  pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}"
                  required
                />
              </div>
              <button type="submit" class="booknow-btn">Book Now</button>
            </form>
          </div>
        </div>
      </section>
      <section class="contact-container">
        <div class="contact-form">
          <h2>Get in Touch</h2>
          <form>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Name"
              autofocus
            /><br />
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email"
              required
            /><br />
            <input
              type="text"
              id="message"
              name="message"
              placeholder="Message"
              autofocus
            /><br /><br />
            <input type="submit" value="Submit" />
          </form>
        </div>
        <div class="contact-map">
          <img src="/Images/map.png" alt="cafe location in a map" />
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
