<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive-form-UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/styles/normalize.css" />
    <link rel="stylesheet" href="/styles/index.css" />
  </head>
  <body>
    <main>
      <section>
        <div>
          <video width="800" height="430" controls="">
            <source src="/Caffe Norra.mp4" type="video/mp4" />
          </video>
        </div>
        <div></div>
      </section>
      <section class="contact-container">
        <div class="contact-form">
          <h2>Get in Touch</h2>
          <form>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Name"
              autofocus=""
            /><br />
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email"
              required=""
            /><br />
            <input
              type="text"
              id="message"
              name="message"
              placeholder="Message"
              autofocus=""
            /><br /><br />
            <input type="submit" value="Submit" />
          </form>
        </div>
        <div class="contact-map">
          <img src="/Images/map.png" alt="cafe location in a map" />
        </div>
      </section>
    </main>
  </body>
</html>
